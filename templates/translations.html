<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#16213e">
    <title>ሕሳር — የትርጉም ማስተካከያ</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/amharic-keyboard.css">
    <link rel="stylesheet" href="/static/translations.css">
</head>
<body>
    <header>
        <div>
            <h1>✎ የትርጉም ማስተካከያ</h1>
            <span class="sub">አማርኛ ⇄ English · ትክክለኛውን ትርጉም ምረጥ ወይም አስተካክል — ይህ መላውን መተግበሪያ ያሻሽላል</span>
        </div>
        <a class="back" href="/">← ወደ ውይይት</a>
    </header>

    <section class="stats" id="stats"></section>

    <section class="toolbar">
        <input id="search" placeholder="ቃል ፈልግ… (በአማርኛ ወይም በእንግሊዝኛ)">
        <button id="kbdToggle">⌨ አማርኛ</button>
        <div class="filters" id="filters"></div>
    </section>

    <div id="kbd"></div>

    <main id="list"></main>
    <button id="moreBtn" class="hidden">ተጨማሪ አሳይ</button>

    <div class="toast" id="toast"></div>

    <script src="/static/amharic-keyboard.js"></script>
    <script src="/static/translations.js"></script>
</body>
</html>
