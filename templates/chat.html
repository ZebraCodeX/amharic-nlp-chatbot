<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#16213e">
    <title>ሕሳር — የአማርኛ AI ውይይት</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ሕሳር">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/amharic-keyboard.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
        header{background:#16213e;padding:12px 20px;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
        header .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        header h1{font-size:1.2em;color:#e94560}
        header span{color:#888;font-size:.85em}
        .trs-toggle{display:flex;align-items:center;gap:8px;font-size:.85em;color:#aaa;cursor:pointer;user-select:none;background:#0f3460;border-radius:20px;padding:6px 12px}
        .trs-toggle input{display:none}
        .trs-toggle .pill{display:flex;align-items:center;gap:6px}
        .trs-toggle .yn{width:40px;height:22px;background:#444;border-radius:11px;position:relative;transition:background .2s}
        .trs-toggle .yn::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s}
        .trs-toggle input:checked + .pill .yn{background:#e94560}
        .trs-toggle input:checked + .pill .yn::after{left:20px}
        .chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
        .msg{max-width:96%;padding:12px 16px;border-radius:12px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
        .msg.user{align-self:flex-end;background:#0f3460;border-bottom-right-radius:4px}
        .msg.ai{align-self:flex-start;background:#16213e;border:1px solid #0f3460;border-bottom-left-radius:4px}
        .dual{display:flex;gap:10px}
        .dual .side{flex:1;min-width:0}
        .dual .sep{width:1px;background:#0f3460;flex:0 0 1px}
        .dual .en{color:#9adbbc;font-size:.95em}
        .dual .en .lbl{display:block;font-size:.72em;color:#4ecdc4;margin-bottom:2px;font-weight:600}
        .dual .am{color:#e0e0e0}
        .msg.ai .ref{color:#e94560;font-weight:600;display:block;margin-bottom:6px}
        .input-area{background:#16213e;border-top:1px solid #0f3460;padding:10px 16px 0}
        .chat-input-row{display:flex;gap:8px;margin-bottom:10px}
        #chatInput{flex:1;padding:12px 16px;font-size:1.2em;border:2px solid #0f3460;border-radius:8px;background:#1a1a2e;color:#fff;outline:none;font-family:'Noto Sans Ethiopic',sans-serif;line-height:1.6}
        #chatInput:focus{border-color:#e94560}
        #sendBtn{padding:12px 22px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;font-weight:600}
        #sendBtn:hover{background:#c73652}
        .suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 8px}
        .sug-btn{padding:4px 12px;background:#1a1a2e;border:1px solid #0f3460;border-radius:14px;color:#aaa;font-size:.85em;cursor:pointer;font-family:'Noto Sans Ethiopic',sans-serif}
        .sug-btn:hover{background:#0f3460;color:#fff}
        .keyboard-toggle{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#888;font-size:.85em;cursor:pointer;user-select:none;width:fit-content}
        .keyboard-toggle .dot{width:8px;height:8px;border-radius:50%;background:#4ecdc4}
        .hidden{display:none!important}
        .followups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
        .fu-chip{font-size:.78em;color:#4ecdc4;background:#0f3460;border:1px solid #4ecdc433;border-radius:14px;padding:4px 10px;cursor:pointer;font-family:'Noto Sans Ethiopic',sans-serif}
        .fu-chip:hover{background:#4ecdc4;color:#12233b}
        .corr-btn{font-size:.72em;color:#888;background:none;border:1px solid #333;border-radius:6px;padding:2px 8px;cursor:pointer;margin-right:6px}
        .corr-btn:hover{border-color:#4ecdc4;color:#4ecdc4}
        .corr-note{font-size:.72em;color:#4ecdc4;display:block;margin-top:4px}
        #installBtn{margin-left:6px;padding:5px 12px;border:1px solid #4ecdc4;border-radius:16px;background:#16213e;color:#4ecdc4;font-size:.78em;cursor:pointer}
        #installBtn:hover{background:#4ecdc4;color:#12233b}
        
        @media(max-width:600px){
            .dual{flex-direction:column}
            .dual .sep{display:none}
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>&#x1235;&#x1295;&#x123B;&#x122D; — Amharic AI</h1>
            <span>Amharic AI</span>
        </div>
        <div class="brand">
            <a href="/review" style="color:#4ecdc4;font-size:.82em;text-decoration:none;background:#0f3460;border-radius:16px;padding:6px 12px">✎ ትርጉም አስተካክል</a>
            <button id="installBtn" class="hidden" onclick="installApp()">&#x2B07; &#x127D;&#x121B;&#x122D; Install</button>
            <label class="trs-toggle" title="Side-by-side English translation">
            <input type="checkbox" id="trsToggle" onchange="document.getElementById('chatInput').dispatchEvent(new Event('input'))">
            <span class="pill">
                EN &#x21C4; አማ
                <span class="yn"></span>
            </span>
        </label>
    </header>

    <div class="chat-container" id="chat">
        <div class="msg ai">
            ሰላም! እኔ ሕሳር ነኝ — የማወያይ የአማርኛ AI ረዳትህ።<br><br>
            ማንኛውንም ጥያቄ ጠይቀኝ፣ ሂሳብ አስላ («5 ጠቅላላ 7»)፣ የአማርኛ ቃል ፍቺ ጠይቅ («ኢንጄራ» ምን ማለት ነው?)፣ ኮድ አስጻፍ («ፓይቶን ኮድ ጻፍልኝ»)፣ ግጥም ወይም እቅድ ጻፍ፣ ወይም «EN ⇄ አማ» በማብራት የእንግሊዝኛ ትርጉም አግኝ!
        </div>
    </div>

    <div class="input-area">
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="በአማርኛ ጻፍልኝ..." autofocus>
            <button id="sendBtn" onclick="sendMsg()">&#x1F4E4; Send</button>
        </div>
        <div class="suggestions" id="suggestions"></div>
        <label class="keyboard-toggle" onclick="kbd.toggle()">
            <span class="dot"></span> &#x2328;&#xFE0F; Amharic Keyboard
        </label>
        <div class="kbd" id="kbd"></div>
    </div>

<script src="/static/amharic-keyboard.js"></script>
<script>
/* ---------- the reusable Amharic keyboard (word search + next-word hints) ---------- */
const kbd = new AmharicKeyboard({
    container: document.getElementById('kbd'),
    input: document.getElementById('chatInput'),
    dictUrl: '/api/words',
    ngramUrl: '/api/ngram',
    suggestUrl: '/api/suggest',
    phonetic: false,                      // default = Amharic Fidel keyboard;
    storageKey: 'hisar.phonetic',         // the toggle (selam → ሰላም) is opt-in
    onSubmit: sendMsg,
    translate: {
        enabled: () => document.getElementById('trsToggle').checked,
        fetch: async (text) => {
            const r = await fetch('/api/translate?text=' + encodeURIComponent(text) + '&to=en');
            const d = await r.json();
            return d.translated || '—';
        }
    }
});

/* ---------- LLM brain status badge ---------- */
(function(){
    fetch('/api/llm-status').then(r=>r.json()).then(d=>{
        const el=document.createElement('span');
        el.style.cssText='font-size:.75em;margin-left:8px;color:'+(d.available?'#4ecdc4':'#777');
        el.textContent=d.available?'✦ real Ai አእምሮ':'offline AI';
        const h=document.querySelector('header span');
        h&&h.appendChild(el);
    }).catch(()=>{});
})();

/* ---------- follow-up suggestion chips ---------- */
function renderFollowups(container, followups){
    if(!followups||!followups.length)return;
    const wrap=document.createElement('div');wrap.className='followups';
    followups.slice(0,4).forEach(q=>{
        const b=document.createElement('button');b.className='fu-chip';b.textContent='↪ '+q;
        b.onclick=()=>{document.getElementById('chatInput').value=q;sendMsg();};
        wrap.appendChild(b);
    });
    container.appendChild(wrap);
}

/* ---------- Messages ---------- */
function addMessage(text, isUser, source, followups){
    const chat=document.getElementById('chat');
    const div=document.createElement('div');
    div.className='msg '+(isUser?'user':'ai');
    const dual=document.createElement('div');dual.className='dual';
    const am=document.createElement('div');am.className='side am';am.textContent=text;
    dual.appendChild(am);
    const trsOn=document.getElementById('trsToggle').checked;
    if(trsOn){
        const sep=document.createElement('div');sep.className='sep';dual.appendChild(sep);
        const en=document.createElement('div');en.className='side en';
        const lbl=document.createElement('span');lbl.className='lbl';lbl.textContent='EN';
        en.appendChild(lbl);
        const tx=document.createElement('div');tx.textContent='…';
        en.appendChild(tx);
        dual.appendChild(en);
         translateToEnglish(text).then(result=>{
             const t=result.translated||'';
             tx.textContent=t||'—';
             if(t){
                 const quality=document.createElement('span');
                 quality.className='corr-note';
                 quality.textContent='ጥራት '+Math.round(Math.max(0,Math.min(1,result.score||0))*100)+'%';
                 en.appendChild(quality);
                 const row=document.createElement('div');
                row.style.cssText='margin-top:6px';
                const ok=document.createElement('button');ok.className='corr-btn';ok.textContent='✓ ትክክል';
                 ok.onclick=()=>rateTranslation(text,t,row,true);
                const fix=document.createElement('button');fix.className='corr-btn';fix.textContent='✎ አእምር';
                fix.onclick=()=>{const better=prompt('ትክክለኛውን ትርጉም ጻፍ:',t);if(better&&better.trim())rateTranslation(text,t,row,false,better);};
                row.appendChild(ok);row.appendChild(fix);
                en.appendChild(row);
            }
        });
    }
    div.appendChild(dual);
    if(source==='llm'){const tag=document.createElement('div');tag.style.cssText='margin-top:6px;font-size:.72em;color:#4ecdc4';tag.textContent='✦ የመስመር አእምሮ';div.appendChild(tag);}
    renderFollowups(div, followups);
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}
function renderRich(text, isUser, followups){
    const chat=document.getElementById('chat');
    const div=document.createElement('div');
    div.className='msg '+(isUser?'user':'ai');
    const dual=document.createElement('div');dual.className='dual';
    const am=document.createElement('div');am.className='side am';am.textContent=text;dual.appendChild(am);
    div.appendChild(dual);
    renderFollowups(div, followups);
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}
async function translateToEnglish(text){
    try{
        const r=await fetch('/api/translate?text='+encodeURIComponent(text)+'&to=en');
        const d=await r.json();
        return d;
    }catch(e){return {translated:'',score:0};}
}
function toHtml(t){
    const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let parts=(esc(t)||'').split('```');
    let out='';
    for(let i=0;i<parts.length;i++){
        if(i%2===1)out+='<pre style="background:#0b1220;border:1px solid #0f3460;border-radius:8px;padding:10px;overflow-x:auto;font-size:.9em;white-space:pre-wrap">'+parts[i].replace(/\n$/,'')+'</pre>';
        else out+='<div style="white-space:pre-wrap">'+parts[i].replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')+'</div>';
    }
    return out;
}

/* ---------- translation feedback: verify or correct ---------- */
async function rateTranslation(srcText, translated, rowEl, ok, correction){
    rowEl.innerHTML='';
    try{
        const body={text:srcText,src:'am',dst:'en',translation:translated};
        if(correction)body.correct=correction;
        else if(ok)body.ok=true;
        const r=await fetch('/api/translate/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        const note=document.createElement('span');note.className='corr-note';
        if(d.ok&&correction)note.textContent='✓ ትርጉምህ ተከማችቷል — አሁን የሁሉም ሰው ትርጉም ይሻሻላል';
        else if(d.ok)note.textContent='✓ ትርጉሙ ተረጋግጧል';
        else note.textContent='ተከማችቶ ሊቀመጥ አልቻለም';
        rowEl.appendChild(note);
    }catch(e){const note=document.createElement('span');note.className='corr-note';note.textContent='ስህተት';rowEl.appendChild(note);}
}

/* ---------- installable app (PWA) ---------- */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').classList.remove('hidden');});
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.add('hidden');});
async function installApp(){
    if(!installPrompt)return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt=null;
}
if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

function showSuggestions(){
    const box=document.getElementById('suggestions');box.innerHTML='';
    const defaults=['ሰላም','AI ምንድን ነው?','ፓይቶን ኮድ ጻፍልኝ','5 ጠቅላላ 7','«ኢንጄራ» ምን ማለት ነው?','ስለ ፍቅር ግጥም ጻፍልኝ','ለትምህርቴ እቅድ አዘጋጅልኝ'];
    defaults.forEach(t=>{const b=document.createElement('button');b.className='sug-btn';b.textContent=t;b.onclick=()=>{document.getElementById('chatInput').value=t;sendMsg()};box.appendChild(b)});
}
showSuggestions();

document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

async function sendMsg(){
    const inp=document.getElementById('chatInput');
    const text=inp.value.trim();
    if(!text)return;
    inp.value='';kbd.refresh();
    addMessage(text,true);
    const history=[...document.querySelectorAll('#chat .msg')].slice(-5).map(m=>({
        role:m.classList.contains('user')?'user':'assistant',
        content:m.textContent}));
    const thinking=document.createElement('div');thinking.className='msg ai';thinking.textContent='...';document.getElementById('chat').appendChild(thinking);document.getElementById('chat').scrollTop=99999;
    try{
        const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,history})});
        const data=await resp.json();
        thinking.remove();
        const trsOn=document.getElementById('trsToggle').checked;
        if(data.reply&&data.reply.includes('```')){
            const div=document.createElement('div');div.className='msg ai';div.innerHTML=toHtml(data.reply);
            if(data.source==='llm'){const tag=document.createElement('div');tag.style.cssText='margin-top:6px;font-size:.72em;color:#4ecdc4';tag.textContent='✦ የመስመር አእምሮ';div.appendChild(tag);}
            renderFollowups(div,data.followups);
            document.getElementById('chat').appendChild(div);document.getElementById('chat').scrollTop=99999;
        }else if(!trsOn && data.reply && data.reply.includes('\n\n')){
            renderRich(data.reply,false,data.followups);
        }else{
            addMessage(data.reply,false,data.source,data.followups);
        }
    }catch(e){thinking.remove();addMessage('የተለመደ ስህተት ተፈጥሯል። እንደገና ሞክር።',false)}
}
</script>
</body>
</html>
