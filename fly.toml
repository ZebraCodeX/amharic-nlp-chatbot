# fly.toml — Fly.io config for ሕሳር (Django/DRF API + React SPA).
# Deploy:  flyctl deploy --remote-only --ha=false
app = "am-ai"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # The embedded GGUF stays out of git (940 MB); the Fly builder downloads it
  # from this public Hugging Face repo at image build time and bakes it in.
  args = { ZER_GGUF_URL = "https://huggingface.co/zee713/zer-qwen-lite-gguf/resolve/main/zer-qwen-q4_k_m.gguf" }

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "*"
  CSRF_TRUSTED_ORIGINS = "https://am-ai.fly.dev"
  HISAR_USERDATA_DIR = "/app/userdata"
  # The bundled Android/iOS/desktop apps call this API from their own origins.
  CORS_ALLOW_ALL = "1"
  # Zer speech: faster-whisper STT + neural TTS (MMS Amharic / Piper English);
  # models are cached on the volume (HF_HOME) and downloaded on first use.
  ZER_WHISPER_MODEL = "base"
  ZER_TTS = "auto"
  HF_HOME = "/app/userdata/hf"
  XDG_CACHE_HOME = "/app/userdata/cache"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Persist crowd corrections + taught facts across restarts.
[mounts]
  source = "hisar_data"
  destination = "/app/userdata"

[[vm]]
  # Whisper + neural TTS (PyTorch/VITS) + the embedded Zer GGUF run on CPU;
  # the ~1 GB model stays resident, so give the machine room.
  memory = "8gb"
  cpu_kind = "shared"
  cpus = 2
