# fly.toml — Fly.io config for ሕሳር (Django/DRF API + React SPA).
# Deploy:  flyctl deploy --remote-only --ha=false
app = "hisar-amharic-ai"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "*"
  CSRF_TRUSTED_ORIGINS = "https://hisar-amharic-ai.fly.dev"
  HISAR_USERDATA_DIR = "/app/userdata"
  # The bundled Android/iOS/desktop apps call this API from their own origins.
  CORS_ALLOW_ALL = "1"
  # Zer speech: faster-whisper STT + eSpeak NG TTS; models cached on the volume.
  ZER_WHISPER_MODEL = "base"
  ZER_TTS = "espeak"
  HF_HOME = "/app/userdata/hf"
  XDG_CACHE_HOME = "/app/userdata/cache"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Persist crowd corrections + taught facts across restarts.
[mounts]
  source = "hisar_data"
  destination = "/app/userdata"

[[vm]]
  # Whisper (base, int8) needs headroom for CPU inference.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
