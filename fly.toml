# fly.toml — Fly.io config for ሕሳር (Django/DRF API + React SPA).
# Deploy:  flyctl deploy --remote-only --ha=false
app = "hisar-amharic-ai"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "*"
  CSRF_TRUSTED_ORIGINS = "https://hisar-amharic-ai.fly.dev"
  HISAR_USERDATA_DIR = "/app/userdata"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Persist crowd corrections + taught facts across restarts.
[mounts]
  source = "hisar_data"
  destination = "/app/userdata"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
